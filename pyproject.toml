[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "epuc-academic-assignment"
version = "0.2.0"
description = "Aplicación local para gestionar información académica"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6>=6.10,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-qt>=4.5,<5",
    "ruff>=0.14,<1",
]

[project.scripts]
epuc-academic-assignment = "main:main"

[tool.setuptools]
packages = [
    "backend",
    "frontend",
    "frontend.views",
    "frontend.widgets",
    "persistence",
]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.data-files]
config = [
    "config/frontend_texts.json",
    "config/frontend_visual.json",
]
"data/public/catalogs" = [
    "data/public/catalogs/academic_profiles.csv",
    "data/public/catalogs/academic_staff.csv",
]
"data/public/tables" = [
    "data/public/tables/Academic.csv",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
